# ─────────────────────────────────────────────────────────────────────────────
# Indic Voice AI — Cloudflare Workers configuration
# Phase 7: Security hardening — API key auth + per-IP rate limiting
# ─────────────────────────────────────────────────────────────────────────────

name               = "indic-voice-workers"
main               = "index.ts"
compatibility_date = "2024-01-01"
node_compat        = false

# ── Static variables ──────────────────────────────────────────────────────────
# Secrets (BACKEND_URL, WORKER_API_KEY) must NOT be set here.
# Use:  wrangler secret put BACKEND_URL
#       wrangler secret put WORKER_API_KEY
[vars]
WORKER_VERSION = "7.0.0"

# Comma-separated list of allowed CORS origins.
# Use "*" for local dev; restrict to your Pages domain in production.
# Example: "https://indic-voice.pages.dev,https://your-domain.com"
ALLOWED_ORIGINS = "*"

# Rate-limit parameters (override in CF dashboard or [env.production.vars])
RATE_LIMIT_REQUESTS        = "20"   # max requests per IP per window
RATE_LIMIT_WINDOW_SECONDS  = "60"   # sliding-window size in seconds

# ── Encrypted secrets (set via CLI, never in this file) ───────────────────────
# wrangler secret put BACKEND_URL
# wrangler secret put WORKER_API_KEY

# ── R2 Storage binding ────────────────────────────────────────────────────────
# Create bucket first: wrangler r2 bucket create indic-voice-audio
[[r2_buckets]]
binding     = "AUDIO_BUCKET"
bucket_name = "indic-voice-audio"

# ── KV Namespace — job state ──────────────────────────────────────────────────
[[kv_namespaces]]
binding    = "JOB_STORE"
id         = "5e611c204c2f41ec8bb569dc94791d5b"
preview_id = "5e611c204c2f41ec8bb569dc94791d5b"

# ── KV Namespace — rate-limit counters ───────────────────────────────────────
# Separate namespace keeps rate-limit TTLs isolated from job records.
[[kv_namespaces]]
binding    = "RATE_LIMITER"
id         = "89bfe3a3357749d3817e47e55a5a493b"
preview_id = "89bfe3a3357749d3817e47e55a5a493b"

# ── Local development ─────────────────────────────────────────────────────────
[dev]
port           = 8787
local_protocol = "http"
ip             = "127.0.0.1"

# ── Build ─────────────────────────────────────────────────────────────────────
[build]
command = "npm run type-check"

# ── Production environment overrides ─────────────────────────────────────────
[env.production]
name = "indic-voice-workers"
# Uncomment and fill in after domain is configured in CF dashboard:
# route = { pattern = "api.your-domain.com/*", zone_name = "your-domain.com" }

[env.production.vars]
WORKER_VERSION            = "7.0.0"
ALLOWED_ORIGINS           = "https://indic-voice.pages.dev"   # restrict in prod
RATE_LIMIT_REQUESTS       = "20"
RATE_LIMIT_WINDOW_SECONDS = "60"
# Secrets for production — set via:
#   wrangler secret put BACKEND_URL      --env production
#   wrangler secret put WORKER_API_KEY   --env production
